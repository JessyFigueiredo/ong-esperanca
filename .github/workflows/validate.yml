name: Validate site

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/app.js js/templates/projects.js js/templates/volunteer.js js/modules/storage.js js/modules/validation.js js/modules/volunteer-form.js; do
            node --check --input-type=module < "$file"
          done
          node --check service-worker.js

      - name: Validate HTML entry documents
        run: npx --yes html-validate@11.16.2 index.html cadastro.html projetos.html

      - name: Check required production files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html cadastro.html projetos.html service-worker.js css/style.css js/app.js js/templates/projects.js js/templates/volunteer.js js/modules/storage.js js/modules/validation.js js/modules/volunteer-form.js imagens/Img1.webp imagens/Img1-400.webp imagens/Img1-768.webp imagens/Img2.webp imagens/Img2-400.webp imagens/Img3.webp imagens/Img3-400.webp imagens/Img3-768.webp imagens/Img4.webp imagens/Img4-400.webp; do
            test -f "$file"
          done

      - name: Build and verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html cadastro.html projetos.html service-worker.js dist/
          cp -R css js dist/
          mkdir -p dist/imagens
          cp imagens/*.webp dist/imagens/
          touch dist/.nojekyll
          npx --yes esbuild@0.25.5 css/style.css --minify --outfile=dist/css/style.css
          npx --yes esbuild@0.25.5 js/app.js js/templates/projects.js js/templates/volunteer.js js/modules/storage.js js/modules/validation.js js/modules/volunteer-form.js --outbase=js --outdir=dist/js --minify --target=es2022
          npx --yes esbuild@0.25.5 service-worker.js --minify --outfile=dist/service-worker.js --target=es2022
          for file in dist/index.html dist/cadastro.html dist/projetos.html dist/service-worker.js dist/css/style.css dist/js/app.js dist/js/templates/projects.js dist/js/templates/volunteer.js dist/js/modules/storage.js dist/js/modules/validation.js dist/js/modules/volunteer-form.js dist/imagens/Img1.webp dist/imagens/Img1-400.webp dist/imagens/Img1-768.webp dist/imagens/Img2.webp dist/imagens/Img2-400.webp dist/imagens/Img3.webp dist/imagens/Img3-400.webp dist/imagens/Img3-768.webp dist/imagens/Img4.webp dist/imagens/Img4-400.webp dist/.nojekyll; do
            test -f "$file"
          done